# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: docker build
      working-directory: ./container-run/container-build-runner
      run: docker build --tag dev-python .

    - name: "docker run: jp.go.jma.py"
      working-directory: ./container-run/container-build-runner
      run: docker run --rm -t -w /mnt -v $(pwd):/mnt dev-python python3.14 /mnt/jp.go.jma.py
    - name: Upload log file
      uses: actions/upload-artifact@v4
      with:
        name: debug-log
        path: ./container-run/container-build-runner/*.json
    - name: Upload log file
      uses: actions/upload-artifact@v4
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        name: output_sub1
        path: ./container-run/container-build-runner/output_sub1.json
